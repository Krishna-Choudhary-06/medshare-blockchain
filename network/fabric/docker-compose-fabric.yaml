version: '2'
services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.2
    environment:
      - ORDERER_GENERAL_LOGLEVEL=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    volumes:
      - ./system-genesis-block:/var/hyperledger/orderer
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
    ports:
      - 7050:7050

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.2
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_default
      - CORE_PEER_FILESYSTEMPATH=/var/hyperledger/production
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
    volumes:
      - ./crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/msp/peer
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./peercfg:/etc/hyperledger/fabric
      - ./fabric-samples/builders/ccaas:/opt/hyperledger/ccaas_builder
    ports:
      - 7051:7051

  peer0.org2.example.com:
    image: hyperledger/fabric-peer:2.2
    environment:
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_ADDRESS=peer0.org2.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_default
      - CORE_PEER_FILESYSTEMPATH=/var/hyperledger/production
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
    volumes:
      - ./crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp:/etc/hyperledger/msp/peer
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./peercfg:/etc/hyperledger/fabric
      - ./fabric-samples/builders/ccaas:/opt/hyperledger/ccaas_builder
    ports:
      - 9051:9051

# NOTE: This is a lightweight scaffold. Use Fabric test-network scripts for a production-ready setup.
